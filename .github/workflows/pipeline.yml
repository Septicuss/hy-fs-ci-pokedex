name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run eslint
      - name: Test
        run: npm run test
      - name: Install Playwright Browsers
        if: ${{ false }}
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        if: ${{ false }}
        run: npm run test:e2e
      - name: Build
        run: npm run build

  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  notify_failure:
    needs: [build_and_test, deploy]
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "❌ **Build Failed!** Encountered an error"
          status: 'Failure'
          nodetail: 'true'
          title: 'Failure Details'
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.head_ref || github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title }}
            **Author:** ${{ github.event.head_commit.author.name || github.event.pull_request.user.name }}
            **Workflow:** ${{ github.workflow }}
            **Job:** ${{ github.job }}
            
            [View Commit](${{ github.event.head_commit.url }})
            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  notify_success:
    needs: [build_and_test, deploy]
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "✅ **Build Succeeded!**"
          status: 'Success'
          nodetail: 'true'
          title: 'Details'
          description: |
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title }}
            **Author:** ${{ github.event.head_commit.author.name || github.event.pull_request.user.name }}

  tag_release:
    needs: [build_and_test, deploy]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          DEFAULT_BUMP: patch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}